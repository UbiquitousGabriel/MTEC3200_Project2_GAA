body{background:var(--bg);color:var(--fg);font-family:var(--sans)}

<script>
const screens=[{"name": "Landing", "action": "Tap \"Get started\" to create an account"}, {"name": "Sign in / Create account", "action": "Sign in (or create an account)"}, {"name": "Map of requests", "action": "Tap a request circle, then \"I can help\""}, {"name": "Browse requests (swipe)", "action": "Swipe right (\"Help\") to offer help on a request"}, {"name": "Ask for help", "action": "Fill in the request and tap \"Post request\""}, {"name": "Messages", "action": "Open a conversation with a match"}, {"name": "Chat + safety", "action": "Send a message to plan the meet-up (Report and Bring a buddy are always here)"}, {"name": "Profile", "action": "Turn \"Available to help\" on or off"}];
const track=document.getElementById('track'),dots=document.getElementById('dots'),label=document.getElementById('label'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),reveal=document.getElementById('reveal'),action=document.getElementById('action');
let cur=0;
screens.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label',(i+1)+' '+s.name);d.addEventListener('click',()=>go(i));dots.appendChild(d)});
function go(i){i=Math.max(0,Math.min(screens.length-1,i));track.scrollTo({left:i*track.clientWidth});set(i)}
function set(i){if(i===cur&&label.dataset.init)return;label.dataset.init=1;cur=i;const s=screens[i];label.textContent=(i+1)+' · '+s.name;count.textContent=(i+1)+' of '+screens.length;
[...dots.children].forEach((d,j)=>d.setAttribute('aria-current',j===i?'true':'false'));prev.disabled=i===0;next.disabled=i===screens.length-1;
action.hidden=true;reveal.setAttribute('aria-expanded','false');reveal.textContent='Show main action';action.textContent='Main action: '+s.action}
let t;track.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>set(Math.round(track.scrollLeft/track.clientWidth)),60)});
prev.addEventListener('click',()=>go(cur-1));next.addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'){go(cur+1)}else if(e.key==='ArrowLeft'){go(cur-1)}});
reveal.addEventListener('click',()=>{const open=action.hidden;action.hidden=!open;reveal.setAttribute('aria-expanded',String(open));reveal.textContent=open?'Hide main action':'Show main action'});
window.addEventListener('resize',()=>track.scrollTo({left:cur*track.clientWidth,behavior:'auto'}));
set(0);
</script>
